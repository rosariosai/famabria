plugins { id 'com.android.application' }

android {
    namespace 'com.famabria.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.famabria.app'
        minSdk 24
        targetSdk 34
        versionCode 21100
        versionName '2.11.0'
    }
    // Release signing: only when CI (or you) provides a keystore through environment variables.
    // Without them (F-Droid builds, local builds) the release APK stays unsigned, as before.
    def keystorePath = System.getenv('KEYSTORE_FILE')
    signingConfigs {
        if (keystorePath) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (keystorePath) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // F-Droid: no dependency metadata blob in the APK (it is signed with a Google-only key)
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
