name: Android APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: node scripts/android-assets.mjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK (CI check, never published)
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Prepare release keystore
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "No KEYSTORE_BASE64 secret: skipping the signed release APK."
          fi
      - name: Build signed release APK
        if: steps.ks.outputs.have == 'true'
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Verify signature and flags
        if: steps.ks.outputs.have == 'true'
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"
          if "$BT/aapt2" dump badging "$APK" | grep -qE "debuggable|testOnly"; then echo "APK is debuggable or testOnly"; exit 1; fi
          VERSION=$(grep -oP "versionName '\K[^']+" android/app/build.gradle)
          cp "$APK" "famabria-$VERSION.apk"
          sha256sum "famabria-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        if: steps.ks.outputs.have == 'true'
        with:
          name: famabria-release-apk
          path: famabria-*.apk
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v') && steps.ks.outputs.have == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: famabria-*.apk
