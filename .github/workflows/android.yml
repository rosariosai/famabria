name: Android APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: node scripts/android-assets.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk famabria-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: famabria-debug-apk
          path: famabria-debug.apk
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: famabria-debug.apk
