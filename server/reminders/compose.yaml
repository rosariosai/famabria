# Famabria reminders -> ntfy. Put this file next to a .env file on your home server, then:  docker compose up -d
# .env:  FAMABRIA_INVITE=<invite link from Famiglia>   NTFY_URL=https://ntfy.sh   NTFY_TOPIC=<long random name>
# To build the image yourself instead of pulling it: docker compose up -d --build
services:
  famabria-reminders:
    image: ghcr.io/rosariosai/famabria-reminders:latest
    build: .
    container_name: famabria-reminders
    restart: unless-stopped
    environment:
      FAMABRIA_INVITE: ${FAMABRIA_INVITE:-${FAMCAL_INVITE:-}}
      NTFY_URL: ${NTFY_URL:?set NTFY_URL in .env}
      NTFY_TOPIC: ${NTFY_TOPIC:?set NTFY_TOPIC in .env}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      POLL_SECONDS: ${POLL_SECONDS:-60}
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - famabria-data:/data   # keeps the credentials the invite was exchanged for
volumes:
  famabria-data:
